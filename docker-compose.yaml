services:
  backend:
    build: .
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./explainer_vectorstore.faiss:/explainer_vectorstore.faiss

  frontend:
    build: .
    command: streamlit run frontend/frontend.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - backend
